server:
  port: 8080
  # This unauthenticated assessment service is intentionally reachable only from the local machine.
  address: 127.0.0.1

spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:h2:file:./data/app;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # Prototype-only convenience. A production deployment needs managed schema migrations.
      ddl-auto: update
    show-sql: false
    # Workflow execution requires fresh persistence contexts so parallel workers see committed state.
    open-in-view: false
